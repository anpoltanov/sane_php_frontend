framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        prefix_seed: sane_php_frontend

        # Filesystem is the default so composer scripts, tests, and local CLI
        # work without Redis. Production compose still uses Redis.
        app: cache.adapter.filesystem

when@prod:
    framework:
        cache:
            app: cache.adapter.redis
            default_redis_provider: '%env(REDIS_URL)%'

when@test:
    framework:
        cache:
            app: cache.adapter.array
